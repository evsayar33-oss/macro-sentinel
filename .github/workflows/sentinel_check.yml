name: Macro Sentinel Engine

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install pandas numpy yfinance requests pytz streamlit

      - name: Run Sentinel Engine
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python main.py

      - name: Save and Commit
        run: |
          git config --global user.name "MacroBot"
          git config --global user.email "bot@macro.com"
          git add cms_history.csv
          git commit -m "Update CMS History: $(date)" || echo "No change"
          git push
