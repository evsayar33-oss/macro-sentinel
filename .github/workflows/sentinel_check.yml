name: Macro Sentinel Autonomous Daily Update

on:
  schedule:
    # Weekdays only. The engine itself also blocks weekend manual runs unless
    # ALLOW_WEEKEND_RUN is explicitly enabled.
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macro-sentinel-daily
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Static syntax check
        run: |
          python -m py_compile main.py regime_engine.py app.py backtest_regimes.py stress_test_analysis.py find_better_strategies.py
          python -m json.tool regime_config.json >/dev/null

      - name: Run live Macro Sentinel engine
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python main.py

      - name: Synthetic invariant regression test
        run: |
          python - <<'PY'
          import numpy as np
          from backtest_regimes import generate_synthetic_macro_history
          from regime_engine import MacroRegimeEngine

          engine = MacroRegimeEngine()
          prepared = engine.prepare_indicators(generate_synthetic_macro_history(seed=42))
          classified = engine.run_time_series(prepared)
          active = classified["oil_event_active"].astype(bool)
          types = classified["oil_event_type"].astype(str).str.upper()
          qualified = classified["oil_structural_qualified"].astype(bool)
          score = classified["oil_event_score"].astype(float)
          if bool(((~active) & types.isin({"MOMENTUM","STRUCTURAL","COMBINED"})).any()):
              raise SystemExit("SYNTHETIC OIL EVENT STATE INCONSISTENT")
          if bool(((types == "STRUCTURAL") & (~qualified)).any()):
              raise SystemExit("SYNTHETIC STRUCTURAL QUALIFICATION INCONSISTENT")
          if bool(((~active) & (abs(score) > 1e-9)).any()):
              raise SystemExit("SYNTHETIC INACTIVE EVENT MUST HAVE ZERO SCORE")
          weights = classified[[
              "regime_cash_weight","regime_gold_weight","regime_bond_weight",
              "regime_eq_weight","regime_commodity_weight","regime_crypto_weight"
          ]].sum(axis=1)
          if not np.allclose(weights.values, 100.0, atol=0.05):
              raise SystemExit("SYNTHETIC ALLOCATION INTEGRITY FAILURE")
          print("synthetic invariant regression: PASS")
          PY

      - name: Validate latest decision and model invariants
        run: |
          python - <<'PY'
          import math
          import pandas as pd

          df = pd.read_csv('cms_history.csv')
          if df.empty:
              raise SystemExit('cms_history.csv is empty')

          # Self-heal legacy/inconsistent persisted oil metadata before validation.
          # The numeric evidence and qualification flag are authoritative; stale
          # serialized event_type/active/score fields are repaired in-place.
          from main import _canonicalize_result_event_state
          from regime_engine import MacroRegimeEngine
          engine_cfg = MacroRegimeEngine().config
          oil_cfg = engine_cfg.get('event_overlay', {}).get('oil', {})
          activation_score = float(oil_cfg.get('activation_score', 0.20))
          last_idx = df.index[-1]
          before = df.loc[last_idx].to_dict()
          after = _canonicalize_result_event_state(before, activation_score)
          repair_fields = [
              'oil_pressure_score', 'oil_event_score', 'oil_event_type',
              'oil_event_active', 'oil_structural_qualified',
              'oil_momentum_confirmed'
          ]
          repaired = False
          for field in repair_fields:
              if field in df.columns and str(df.at[last_idx, field]) != str(after.get(field)):
                  df.at[last_idx, field] = after.get(field)
                  repaired = True
          if repaired:
              df.to_csv('cms_history.csv', index=False)
              print('legacy/inconsistent oil event state repaired before validation')

          row = df.iloc[-1]
          health = str(row.get('data_health_status', 'HALT')).upper()
          coverage = str(row.get('event_coverage_status', 'UNKNOWN')).upper()
          decision = str(row.get('decision_status', 'UNKNOWN')).upper()
          source = str(row.get('allocation_source', 'UNKNOWN')).upper()

          weights = [float(row.get(c, 0.0)) for c in [
              'cash_weight','gold_weight','bond_weight','eq_weight','commodity_weight','crypto_weight'
          ]]
          total = sum(weights)
          oil_score = float(row.get('oil_event_score', 0.0) or 0.0)
          oil_pressure = float(row.get('oil_pressure_score', 0.0) or 0.0)
          oil_type = str(row.get('oil_event_type', 'NONE')).upper()
          oil_active = str(row.get('oil_event_active', 'False')).lower() in {'1','true','yes','on'}
          overlay = str(row.get('commodity_event_active', 'False')).lower() in {'1','true','yes','on'}
          structural = float(row.get('oil_structural_score', 0.0) or 0.0)
          structural_qualified = str(row.get('oil_structural_qualified', 'False')).lower() in {'1','true','yes','on'}
          momentum = float(row.get('oil_momentum_score', 0.0) or 0.0)
          pending_id = int(float(row.get('pending_regime_id', 0) or 0))
          pending_count = int(float(row.get('pending_regime_count', 0) or 0))

          print(f'data_health={health}')
          print(f'event_coverage={coverage}')
          print(f'decision_status={decision}')
          print(f'allocation_source={source}')
          print(f'allocation_total={total:.4f}')
          print(f'regime={row.get("regime_name", "UNKNOWN")}')
          print(f'oil_active={oil_active}')
          print(f'oil_event_score={oil_score:.3f}')
          print(f'oil_pressure_score={oil_pressure:.3f}')
          print(f'oil_event_type={oil_type}')
          print(f'oil_momentum_score={momentum:.3f}')
          print(f'oil_structural_score={structural:.3f}')
          print(f'oil_structural_qualified={structural_qualified}')
          print(f'oil_allocation_overlay={overlay}')
          print(f'pending_regime=R{pending_id} count={pending_count}')
          print(f'audit_status={row.get("daily_audit_status", "UNKNOWN")}')

          if not all(math.isfinite(x) and x >= -1e-9 for x in weights):
              raise SystemExit('INVALID ALLOCATION WEIGHT')
          if abs(total - 100.0) > 0.05:
              raise SystemExit('ALLOCATION INTEGRITY FAILURE')

          if decision not in {'LIVE', 'HOLD_LAST_VALID', 'MARKET_CLOSED_HOLD'}:
              raise SystemExit(f'INVALID DECISION STATUS: {decision}')

          if health == 'HALT' and decision == 'LIVE':
              raise SystemExit('HALT cannot coexist with LIVE decision')
          if source == 'LIVE_ENGINE' and health == 'HALT':
              raise SystemExit('LIVE_ENGINE source cannot coexist with HALT health')

          if oil_score < -1e-9 or oil_score > 1.0 + 1e-9 or oil_pressure < -1e-9 or oil_pressure > 1.0 + 1e-9:
              raise SystemExit('OIL SCORE RANGE FAILURE')
          if structural < -1e-9 or structural > 1.0 + 1e-9 or momentum < -1e-9 or momentum > 1.0 + 1e-9:
              raise SystemExit('OIL COMPONENT RANGE FAILURE')

          confirmed_types = {'MOMENTUM', 'STRUCTURAL', 'COMBINED'}
          if oil_active:
              if oil_type not in confirmed_types:
                  raise SystemExit('OIL ACTIVE BUT EVENT TYPE IS NOT CONFIRMED')
              if oil_score < 0.20:
                  raise SystemExit('OIL ACTIVE BUT EVENT SCORE IS BELOW ACTIVATION')
              expected_score = max(momentum, structural)
              if abs(oil_score - expected_score) > 0.01:
                  raise SystemExit('OIL EVENT SCORE IS INCONSISTENT WITH COMPONENT SCORES')
          else:
              if oil_type in confirmed_types:
                  raise SystemExit('OIL TYPE CLAIMS CONFIRMED EVENT BUT OIL_EVENT_ACTIVE IS FALSE')
              if oil_type not in {'NONE', 'PRESSURE_ONLY'}:
                  raise SystemExit('INACTIVE OIL STATE HAS INVALID EVENT TYPE')
              if abs(oil_score) > 0.01:
                  raise SystemExit('INACTIVE OIL EVENT MUST HAVE ZERO EVENT SCORE')

          if oil_type == 'STRUCTURAL' and not structural_qualified:
              raise SystemExit('STRUCTURAL EVENT REQUIRES STRUCTURAL QUALIFICATION')
          if overlay and not oil_active:
              raise SystemExit('COMMODITY OVERLAY CANNOT BE ACTIVE WITHOUT CONFIRMED OIL EVENT')
          if coverage not in {'FULL', 'PARTIAL', 'UNKNOWN', 'NOT_EVALUATED'}:
              raise SystemExit('INVALID EVENT COVERAGE STATUS')
          PY

      - name: Commit trusted history update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cms_history.csv
          git commit -m "🤖 Macro Sentinel: trusted daily state update" || echo "No history change"
          git push
